services:
  ocr-api:
    build: .
    image: unlimited-ocr-fastapi:latest
    container_name: unlimited-ocr-fastapi
    ports:
      - "8000:8000"
    environment:
      # Point this at your vLLM server. From inside compose you can reach a
      # sibling service by its name (e.g. http://vllm:8000), or use
      # host.docker.internal to reach a vLLM server on the host machine.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OCR_MODEL: ${OCR_MODEL:-baidu/Unlimited-OCR}
      OCR_MAX_CONCURRENCY: ${OCR_MAX_CONCURRENCY:-4}
      OCR_REQUEST_TIMEOUT: ${OCR_REQUEST_TIMEOUT:-1200}
      OCR_MAX_TOKENS: ${OCR_MAX_TOKENS:-8192}
      PDF_DPI: ${PDF_DPI:-300}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      MAX_FILES: ${MAX_FILES:-20}
    extra_hosts:
      # Lets the container resolve host.docker.internal on Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
