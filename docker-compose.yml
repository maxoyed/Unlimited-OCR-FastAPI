services:
  ocr-api:
    build: .
    image: unlimited-ocr-fastapi:latest
    container_name: unlimited-ocr-fastapi
    ports:
      - "8000:8000"
    environment:
      # Point this at your sglang server. From inside compose you can reach a
      # sibling service by its name (e.g. http://sglang:30000), or use
      # host.docker.internal to reach an sglang server on the host machine.
      SGLANG_BASE_URL: ${SGLANG_BASE_URL:-http://host.docker.internal:30000}
      SGLANG_API_KEY: ${SGLANG_API_KEY:-}
      OCR_MODEL: ${OCR_MODEL:-Unlimited-OCR}
      OCR_MAX_CONCURRENCY: ${OCR_MAX_CONCURRENCY:-4}
      OCR_REQUEST_TIMEOUT: ${OCR_REQUEST_TIMEOUT:-1200}
      PDF_DPI: ${PDF_DPI:-300}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      MAX_FILES: ${MAX_FILES:-20}
    extra_hosts:
      # Lets the container resolve host.docker.internal on Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
